name: Deploy to Bunny.net Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bunny-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Bunny.net Storage Zone
        uses: ayeressian/bunnycdn-storage-deploy@251c77f4b9e7e683ad00086de2bef5770c3386b2 # v2.4.5
        with:
          source: "dist"
          destination: ""
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storagePassword: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          storageEndpoint: "storage.bunnycdn.com"
          upload: "true"
          remove: "true"
          purgePullZone: "false"
